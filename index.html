*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#050705}
body{font-family:Inter,Arial,sans-serif;color:#fff;overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 70% 38% at 12% 18%,rgba(100,140,0,.75),transparent 72%),radial-gradient(ellipse 45% 30% at 100% 78%,rgba(110,190,0,.62),transparent 72%),radial-gradient(ellipse 60% 25% at 0 100%,rgba(40,90,0,.35),transparent 70%)}

.ic,.tx,.go{position:absolute;top:50%;transform:translateY(-50%)}

.tx{left:calc(var(--u)*var(--tl));z-index:3}

.go{right:calc(var(--u)*var(--ar));width:calc(var(--u)*var(--as));height:calc(var(--u)*var(--as));border-radius:50%;background:var(--ab);display:grid;place-items:center;z-index:4}

.pw{position:absolute;bottom:0;height:calc(var(--u)*var(--wh));overflow:hidden;z-index:2;pointer-events:none}

.tk{position:absolute;z-index:3;top:calc(var(--u)*var(--tt));right:calc(var(--u)*var(--tr));width:calc(var(--u)*30);height:calc(var(--u)*30);color:var(--tc,#c6ff00);pointer-events:none}

<div class="me-tx rv"><span class="sub">Sobre Mim</span>
<p>Sou o <strong>Ruan Lopes</strong>, desenvolvedor web freelancer de Pindaí, Bahia. Crio sites, cardápios digitais, lojas e sistemas de gestão para negócios da região, usando <strong>React, Next.js, TypeScript, Supabase e PostgreSQL</strong>.</p>
<p>Entrego projetos completos: do design ao desenvolvimento, publicação e manutenção. Também desenvolvo produtos SaaS, como o ERP <strong>RM Gestão</strong>, para pequenas e médias empresas.</p>
<p>Entre os meus clientes estão a <strong>Carbono Cell</strong> e a <strong>Lanchonete e Pizzaria Avenida</strong>.</p>
